<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GestorPro v2.5 - Control de Suscripciones</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased selection:bg-indigo-500 selection:text-white pb-12">

    <!-- ================= PANTALLA DE LOGIN ================= -->
    <div id="authScreen" class="fixed inset-0 bg-slate-950 z-50 flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-md rounded-2xl p-8 space-y-6 shadow-2xl">
            <div class="text-center space-y-2">
                <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center mx-auto shadow-lg shadow-indigo-500/30">
                    <i data-lucide="shield-check" class="w-6 h-6 text-white"></i>
                </div>
                <h1 class="text-xl font-bold tracking-tight">GestorPro Acceso</h1>
                <p class="text-xs text-slate-400">Ingresa con tu usuario y contraseña</p>
            </div>

            <form id="loginForm" onsubmit="handleLoginUser(event)" class="space-y-4">
                <div>
                    <label class="text-xs font-medium text-slate-300">Usuario</label>
                    <input type="text" id="loginUsername" required autocomplete="username" placeholder="Ej. K4VIEL" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm mt-1 focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="text-xs font-medium text-slate-300">Contraseña</label>
                    <input type="password" id="loginPassword" required autocomplete="current-password" placeholder="••••••••" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm mt-1 focus:outline-none focus:border-indigo-500">
                </div>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white py-2.5 rounded-xl text-sm font-medium transition shadow-lg shadow-indigo-600/20">
                    Iniciar Sesión
                </button>
            </form>

            <div class="border-t border-slate-800 pt-4 text-center">
                <button onclick="bypassLoginLocal()" class="text-xs text-slate-400 hover:text-slate-200">
                    ⚡ Entrar en Modo Local (Prueba)
                </button>
            </div>
        </div>
    </div>

    <!-- ================= APLICACIÓN PRINCIPAL ================= -->
    <div id="appContainer" class="hidden">
        <header class="bg-slate-900/80 backdrop-blur-md border-b border-slate-800 sticky top-0 z-40">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center shadow-lg shadow-indigo-500/30">
                        <i data-lucide="shield-check" class="w-5 h-5 text-white"></i>
                    </div>
                    <div>
                        <h1 class="font-bold text-lg tracking-tight flex items-center gap-2">
                            GestorPro <span class="text-xs px-2 py-0.5 rounded-full bg-indigo-500/20 text-indigo-400 border border-indigo-500/30">v2.5</span>
                        </h1>
                        <p class="text-xs text-slate-400" id="userRoleDisplay">Conectado</p>
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <button onclick="handleLogout()" class="flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-medium bg-rose-500/10 text-rose-400 border border-rose-500/20 hover:bg-rose-500/20 transition">
                        <i data-lucide="log-out" class="w-4 h-4"></i> Salir
                    </button>
                </div>
            </div>
        </header>

        <nav class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-6">
            <div class="flex space-x-2 border-b border-slate-800 pb-px overflow-x-auto">
                <button onclick="switchTab('subscriptions')" id="tab-subscriptions" class="tab-btn px-4 py-2.5 text-sm font-semibold rounded-t-lg transition flex items-center gap-2 border-b-2 border-indigo-500 text-indigo-400 bg-indigo-500/10">
                    <i data-lucide="users" class="w-4 h-4"></i> Suscripciones y Clientes
                </button>
            </div>
        </nav>

        <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-6">
            <section id="view-subscriptions" class="space-y-6">
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                    <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl shadow-sm">
                        <span class="text-xs font-medium text-slate-400">Ingresos Mensuales Est.</span>
                        <div class="mt-2 text-2xl font-bold text-slate-100" id="stat-revenue">$0.00</div>
                    </div>
                    <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl shadow-sm">
                        <span class="text-xs font-medium text-slate-400">Clientes Activos</span>
                        <div class="mt-2 text-2xl font-bold text-slate-100" id="stat-active">0</div>
                    </div>
                    <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl shadow-sm">
                        <span class="text-xs font-medium text-slate-400">Por Vencer (Próx. 3 días)</span>
                        <div class="mt-2 text-2xl font-bold text-slate-100" id="stat-warning">0</div>
                    </div>
                    <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl shadow-sm">
                        <span class="text-xs font-medium text-slate-400">Vencidos</span>
                        <div class="mt-2 text-2xl font-bold text-slate-100" id="stat-expired">0</div>
                    </div>
                </div>

                <div class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-4 bg-slate-900 p-4 rounded-2xl border border-slate-800">
                    <div class="flex flex-wrap items-center gap-3 flex-1">
                        <div class="relative flex-1 min-w-[220px]">
                            <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3 top-3"></i>
                            <input type="text" id="search-sub" oninput="renderSubscriptions()" placeholder="Buscar cliente..." class="w-full bg-slate-950 border border-slate-800 rounded-xl pl-9 pr-4 py-2 text-sm focus:outline-none focus:border-indigo-500">
                        </div>
                        <select id="filter-service" onchange="handleFilterServiceChange(this)" class="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-indigo-500">
                            <option value="">Todos los servicios</option>
                            <option value="Canva Pro">Canva Pro</option>
                            <option value="YouTube Premium">YouTube Premium</option>
                            <option value="Google Gemini">Google Gemini</option>
                            <option value="Netflix">Netflix</option>
                            <option value="Spotify">Spotify</option>
                            <option value="Disney+">Disney+</option>
                            <option value="add_new">✨ Añadir otro servicio...</option>
                        </select>
                    </div>
                    <button onclick="openSubModal()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-xl text-sm font-medium flex items-center justify-center gap-2 transition">
                        <i data-lucide="plus" class="w-4 h-4"></i> Nuevo Cliente
                    </button>
                </div>

                <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-xl">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="border-b border-slate-800 bg-slate-950/50 text-slate-400 text-xs font-semibold uppercase">
                                    <th class="p-4">Cliente / Contacto</th>
                                    <th class="p-4">Servicio</th>
                                    <th class="p-4">Correo Asignado</th>
                                    <th class="p-4">Vencimiento</th>
                                    <th class="p-4">Estado</th>
                                    <th class="p-4 text-right">Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="subscriptions-table-body" class="divide-y divide-slate-800 text-sm"></tbody>
                        </table>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- MODAL CLIENTE -->
    <div id="subModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-lg rounded-2xl p-6 space-y-4 shadow-2xl">
            <h3 class="text-lg font-bold">Registrar Cliente</h3>
            <form id="subForm" onsubmit="saveSubscription(event)" class="space-y-3">
                <input type="hidden" id="subId">
                <input type="text" id="clientName" required placeholder="Nombre del Cliente" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm">
                <input type="text" id="clientPhone" required placeholder="WhatsApp" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm">
                
                <div>
                    <label class="text-xs text-slate-400">Servicio</label>
                    <select id="clientService" onchange="handleModalServiceChange(this)" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm mt-1">
                        <option value="Canva Pro">Canva Pro</option>
                        <option value="YouTube Premium">YouTube Premium</option>
                        <option value="Google Gemini">Google Gemini</option>
                        <option value="Netflix">Netflix</option>
                        <option value="Spotify">Spotify</option>
                        <option value="Disney+">Disney+</option>
                        <option value="add_new">✨ Añadir otro servicio...</option>
                    </select>
                </div>

                <input type="email" id="clientEmail" placeholder="Correo Asignado" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm">
                
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="text-xs text-slate-400">Inicio</label>
                        <input type="date" id="clientStartDate" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm mt-1">
                    </div>
                    <div>
                        <label class="text-xs text-slate-400">Vencimiento</label>
                        <input type="date" id="clientEndDate" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm mt-1">
                    </div>
                </div>

                <input type="number" step="0.01" id="clientPrice" required placeholder="Precio ($)" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm">
                
                <div class="flex justify-end gap-3 pt-2">
                    <button type="button" onclick="closeSubModal()" class="px-4 py-2 bg-slate-800 rounded-xl text-sm">Cancelar</button>
                    <button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded-xl text-sm">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        localStorage.setItem('gestorpro_sb_url', 'https://pasdtqkukyybjykxuwyx.supabase.co');
        localStorage.setItem('gestorpro_sb_key', 'sb_publishable_N5WRoV4mDWazZZmgXuEJYQ_cjmvhdss');

        let db = { subscriptions: [] };
        let customServices = JSON.parse(localStorage.getItem('gestorpro_custom_services') || '[]');
        let supabaseClient = null;
        let currentUser = null;

        window.addEventListener('DOMContentLoaded', () => {
            updateServiceSelects();
            loadLocalData();
            checkExistingSession();
            lucide.createIcons();
            setDefaultDates();
        });

        function updateServiceSelects() {
            const selects = [document.getElementById('filter-service'), document.getElementById('clientService')];
            selects.forEach(select => {
                if(!select) return;
                const currentVal = select.value;
                // Mantener opciones fijas y limpiar las añadidas previamente
                let html = select.id === 'filter-service' ? '<option value="">Todos los servicios</option>' : '';
                const defaultOpts = ['Canva Pro', 'YouTube Premium', 'Google Gemini', 'Netflix', 'Spotify', 'Disney+'];
                
                defaultOpts.forEach(opt => {
                    html += `<option value="${opt}">${opt}</option>`;
                });

                customServices.forEach(serv => {
                    html += `<option value="${serv}">${serv}</option>`;
                });

                html += `<option value="add_new">✨ Añadir otro servicio...</option>`;
                select.innerHTML = html;
                select.value = currentVal || '';
            });
        }

        async function handleFilterServiceChange(select) {
            if (select.value === 'add_new') {
                await promptNewService();
                select.value = '';
            }
            renderSubscriptions();
        }

        async function handleModalServiceChange(select) {
            if (select.value === 'add_new') {
                await promptNewService();
            }
        }

        async function promptNewService() {
            const { value: newService } = await Swal.fire({
                title: 'Añadir nuevo servicio',
                input: 'text',
                inputPlaceholder: 'Ej. Crunchyroll, IPTV, etc.',
                showCancelButton: true,
                confirmButtonText: 'Añadir',
                cancelButtonText: 'Cancelar'
            });

            if (newService && newService.trim() !== '') {
                const formatted = newService.trim();
                if (!customServices.includes(formatted)) {
                    customServices.push(formatted);
                    localStorage.setItem('gestorpro_custom_services', JSON.stringify(customServices));
                    updateServiceSelects();
                }
                document.getElementById('clientService').value = formatted;
            }
        }

        function setDefaultDates() {
            const today = new Date().toISOString().split('T')[0];
            const nextMonth = new Date();
            nextMonth.setMonth(nextMonth.getMonth() + 1);
            document.getElementById('clientStartDate').value = today;
            document.getElementById('clientEndDate').value = nextMonth.toISOString().split('T')[0];
        }

        function getSupabaseInstance() {
            const url = localStorage.getItem('gestorpro_sb_url');
            const key = localStorage.getItem('gestorpro_sb_key');
            if (url && key) return window.supabase.createClient(url, key);
            return null;
        }

        async function handleLoginUser(e) {
            e.preventDefault();
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value.trim();

            const client = getSupabaseInstance();
            if (!client) {
                Swal.fire('Error', 'No se pudo conectar a Supabase', 'error');
                return;
            }

            const { data, error } = await client.from('usuarios').select('*').eq('username', username).eq('password', password).single();

            if (error || !data) {
                Swal.fire('Error', 'Usuario o contraseña incorrectos', 'error');
                return;
            }

            currentUser = data;
            sessionStorage.setItem('gestorpro_session', JSON.stringify(currentUser));
            initAppAfterLogin();
        }

        function bypassLoginLocal() {
            currentUser = { username: 'modo_local', role: 'admin' };
            sessionStorage.setItem('gestorpro_session', JSON.stringify(currentUser));
            initAppAfterLogin();
        }

        function checkExistingSession() {
            const session = sessionStorage.getItem('gestorpro_session');
            if (session) {
                currentUser = JSON.parse(session);
                initAppAfterLogin();
            }
        }

        function initAppAfterLogin() {
            document.getElementById('authScreen').classList.add('hidden');
            document.getElementById('appContainer').classList.remove('hidden');
            document.getElementById('userRoleDisplay').innerText = `Usuario: ${currentUser.username}`;
            supabaseClient = getSupabaseInstance();
            refreshUI();
        }

        function handleLogout() {
            sessionStorage.removeItem('gestorpro_session');
            currentUser = null;
            document.getElementById('appContainer').classList.add('hidden');
            document.getElementById('authScreen').classList.remove('hidden');
        }

        function switchTab(tabName) {
            document.querySelectorAll('main > section').forEach(sec => sec.classList.add('hidden'));
            document.getElementById(`view-${tabName}`).classList.remove('hidden');
            lucide.createIcons();
        }

        function loadLocalData() {
            const saved = localStorage.getItem('gestorpro_data');
            if (saved) {
                try { db = JSON.parse(saved); } catch (e) {}
            } else {
                db.subscriptions = [{ id: '1', client_name: 'Carlos Mendoza', phone: '+51987654321', service: 'Canva Pro', email: 'carlos@gmail.com', start_date: '2026-03-01', end_date: '2026-04-01', price: 5.00 }];
                saveLocalData();
            }
        }

        function saveLocalData() { localStorage.setItem('gestorpro_data', JSON.stringify(db)); }

        async function refreshUI() {
            if (supabaseClient) {
                const { data, error } = await supabaseClient.from('subscriptions').select('*');
                if (!error && data) db.subscriptions = data;
            }
            renderSubscriptions();
            updateDashboardMetrics();
            lucide.createIcons();
        }

        function renderSubscriptions() {
            const tbody = document.getElementById('subscriptions-table-body');
            tbody.innerHTML = '';
            const search = document.getElementById('search-sub').value.toLowerCase();
            const filterService = document.getElementById('filter-service').value;
            const today = new Date();

            const filtered = db.subscriptions.filter(sub => {
                const matchSearch = (sub.client_name || '').toLowerCase().includes(search) || (sub.email || '').toLowerCase().includes(search);
                const matchService = !filterService || sub.service === filterService;
                return matchSearch && matchService;
            });

            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="p-6 text-center text-slate-500">No hay registros encontrados.</td></tr>`;
                return;
            }

            filtered.forEach(sub => {
                const endDate = new Date(sub.end_date);
                const diffDays = Math.ceil((endDate - today) / (1000 * 60 * 60 * 24));
                let statusBadge = diffDays < 0 ? `<span class="px-2.5 py-1 rounded-full text-xs font-medium bg-rose-500/10 text-rose-400 border border-rose-500/20">Vencido</span>` : diffDays <= 3 ? `<span class="px-2.5 py-1 rounded-full text-xs font-medium bg-amber-500/10 text-amber-400 border border-amber-500/20">Por Vencer (${diffDays}d)</span>` : `<span class="px-2.5 py-1 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">Activo</span>`;

                const cleanPhone = (sub.phone || '').replace(/\D/g, '');
                const msg = `¡Hola ${sub.client_name}! 👋 Te recordamos que tu suscripción a *${sub.service}* vence el *${sub.end_date}*. ¿Deseas renovar? 🚀`;

                tbody.innerHTML += `
                    <tr class="hover:bg-slate-900/50 transition border-b border-slate-800">
                        <td class="p-4"><div class="font-medium text-slate-200">${sub.client_name}</div><div class="text-xs text-slate-400">${sub.phone}</div></td>
                        <td class="p-4 font-medium text-slate-200">${sub.service}</td>
                        <td class="p-4 text-xs font-mono text-slate-300">${sub.email || 'N/A'}</td>
                        <td class="p-4"><div class="text-slate-200">${sub.end_date}</div><div class="text-xs text-slate-400">$${Number(sub.price || 0).toFixed(2)}</div></td>
                        <td class="p-4">${statusBadge}</td>
                        <td class="p-4 text-right space-x-1">
                            <a href="https://wa.me/${cleanPhone}?text=${encodeURIComponent(msg)}" target="_blank" class="p-1.5 bg-emerald-600/20 text-emerald-400 hover:bg-emerald-600/30 rounded-lg inline-block" title="WhatsApp"><i data-lucide="message-circle" class="w-4 h-4"></i></a>
                            <button onclick="deleteSub('${sub.id}')" class="p-1.5 bg-rose-500/20 text-rose-400 hover:bg-rose-500/30 rounded-lg" title="Eliminar"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                        </td>
                    </tr>`;
            });
            lucide.createIcons();
        }

        function updateDashboardMetrics() {
            let totalRevenue = 0, activeCount = 0, warningCount = 0, expiredCount = 0;
            const today = new Date();
            db.subscriptions.forEach(sub => {
                totalRevenue += Number(sub.price || 0);
                const diffDays = Math.ceil((new Date(sub.end_date) - today) / (1000 * 60 * 60 * 24));
                if (diffDays < 0) expiredCount++;
                else if (diffDays <= 3) warningCount++;
                else activeCount++;
            });
            document.getElementById('stat-revenue').innerText = `$${totalRevenue.toFixed(2)}`;
            document.getElementById('stat-active').innerText = activeCount;
            document.getElementById('stat-warning').innerText = warningCount;
            document.getElementById('stat-expired').innerText = expiredCount;
        }

        function openSubModal() {
            document.getElementById('subModal').classList.remove('hidden');
            document.getElementById('subForm').reset();
            setDefaultDates();
            updateServiceSelects();
        }

        function closeSubModal() { document.getElementById('subModal').classList.add('hidden'); }

        async function saveSubscription(e) {
            e.preventDefault();
            const payload = {
                id: Date.now().toString(),
                client_name: document.getElementById('clientName').value.trim(),
                phone: document.getElementById('clientPhone').value.trim(),
                service: document.getElementById('clientService').value,
                email: document.getElementById('clientEmail').value.trim(),
                start_date: document.getElementById('clientStartDate').value,
                end_date: document.getElementById('clientEndDate').value,
                price: parseFloat(document.getElementById('clientPrice').value)
            };

            if (supabaseClient) {
                const { error } = await supabaseClient.from('subscriptions').insert([payload]);
                if (error) {
                    Swal.fire('Error al guardar', error.message, 'error');
                    return;
                }
            }

            db.subscriptions.push(payload);
            saveLocalData();
            closeSubModal();
            refreshUI();
            Swal.fire({icon: 'success', title: '¡Venta registrada!', timer: 1500, showConfirmButton: false});
        }

        async function deleteSub(id) {
            const res = await Swal.fire({ title: '¿Eliminar?', icon: 'warning', showCancelButton: true, confirmButtonColor: '#4f46e5' });
            if (res.isConfirmed) {
                if (supabaseClient) await supabaseClient.from('subscriptions').delete().eq('id', id);
                db.subscriptions = db.subscriptions.filter(s => s.id != id);
                saveLocalData();
                refreshUI();
            }
        }
    </script>
</body>
</html>
