<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GestorPro v2.3 - Control de Suscripciones</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased selection:bg-indigo-500 selection:text-white pb-12">

    <!-- ================= PANTALLA DE LOGIN ================= -->
    <div id="authScreen" class="fixed inset-0 bg-slate-950 z-50 flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-md rounded-2xl p-8 space-y-6 shadow-2xl">
            <div class="text-center space-y-2">
                <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center mx-auto shadow-lg shadow-indigo-500/30">
                    <i data-lucide="shield-check" class="w-6 h-6 text-white"></i>
                </div>
                <h1 class="text-xl font-bold tracking-tight">GestorPro Acceso</h1>
                <p class="text-xs text-slate-400">Ingresa con tu usuario y contraseña</p>
            </div>

            <div id="loginConfigWarning" class="bg-amber-500/10 border border-amber-500/20 p-3 rounded-xl text-xs text-amber-300 space-y-2">
                <p class="font-semibold">⚠️ Configuración Requerida:</p>
                <p>Configura tus llaves de Supabase para activar el inicio de sesión.</p>
                <button onclick="toggleConfigModal()" class="underline font-medium text-amber-200">Configurar Supabase</button>
            </div>

            <form id="loginForm" onsubmit="handleLoginUser(event)" class="space-y-4">
                <div>
                    <label class="text-xs font-medium text-slate-300">Nombre de Usuario</label>
                    <input type="text" id="loginUsername" required placeholder="Ej. admin o trabajador1" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm mt-1 focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="text-xs font-medium text-slate-300">Contraseña</label>
                    <input type="password" id="loginPassword" required placeholder="••••••••" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm mt-1 focus:outline-none focus:border-indigo-500">
                </div>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white py-2.5 rounded-xl text-sm font-medium transition shadow-lg shadow-indigo-600/20">
                    Iniciar Sesión
                </button>
            </form>

            <div class="border-t border-slate-800 pt-4 flex justify-between items-center text-xs">
                <button onclick="toggleConfigModal()" class="text-slate-400 hover:text-slate-200">⚙️ Configurar Base de Datos</button>
                <button onclick="bypassLoginLocal()" class="text-slate-400 hover:text-slate-200">⚡ Modo Local</button>
            </div>
        </div>
    </div>

    <!-- ================= APLICACIÓN PRINCIPAL ================= -->
    <div id="appContainer" class="hidden">
        <header class="bg-slate-900/80 backdrop-blur-md border-b border-slate-800 sticky top-0 z-40">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center shadow-lg shadow-indigo-500/30">
                        <i data-lucide="shield-check" class="w-5 h-5 text-white"></i>
                    </div>
                    <div>
                        <h1 class="font-bold text-lg tracking-tight flex items-center gap-2">
                            GestorPro <span class="text-xs px-2 py-0.5 rounded-full bg-indigo-500/20 text-indigo-400 border border-indigo-500/30">v2.3</span>
                        </h1>
                        <p class="text-xs text-slate-400" id="userRoleDisplay">Conectado</p>
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <button onclick="handleLogout()" class="flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-medium bg-rose-500/10 text-rose-400 border border-rose-500/20 hover:bg-rose-500/20 transition">
                        <i data-lucide="log-out" class="w-4 h-4"></i> Salir
                    </button>
                </div>
            </div>
        </header>

        <nav class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-6">
            <div class="flex space-x-2 border-b border-slate-800 pb-px overflow-x-auto">
                <button onclick="switchTab('subscriptions')" id="tab-subscriptions" class="tab-btn px-4 py-2.5 text-sm font-semibold rounded-t-lg transition flex items-center gap-2 border-b-2 border-indigo-500 text-indigo-400 bg-indigo-500/10">
                    <i data-lucide="users" class="w-4 h-4"></i> Suscripciones y Clientes
                </button>
                <button onclick="switchTab('providers')" id="tab-providers" class="tab-btn px-4 py-2.5 text-sm font-semibold rounded-t-lg transition flex items-center gap-2 border-b-2 border-transparent text-slate-400 hover:text-slate-200 hover:bg-slate-900">
                    <i data-lucide="server" class="w-4 h-4"></i> Cuentas Master / Proveedores
                </button>
                <button onclick="switchTab('finances')" id="tab-finances" class="tab-btn px-4 py-2.5 text-sm font-semibold rounded-t-lg transition flex items-
